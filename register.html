<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Bloom Botanical Studio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap"
    rel="stylesheet">

  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      margin: 0;
      overflow: hidden;
    }

    .auth-card {
      width: 100%;
      max-width: 450px;
      padding: 40px 60px;
      background: var(--bg-secondary);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .auth-logo {
      font-family: var(--font-serif);
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 20px;
      display: block;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--text-muted);
      background: transparent;
      color: var(--text-primary);
      border-radius: var(--radius);
    }

    .auth-btn {
      width: 100%;
      padding: 12px;
      background: var(--color-primary);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-family: var(--font-sans);
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: var(--transition);
    }

    .auth-btn:hover {
      background: #4A5D45;
      transform: translateY(-1px);
    }

    .terms-group {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      color: var(--text-secondary);
    }

    .terms-group a {
      color: var(--color-primary);
      text-decoration: none;
      font-weight: 500;
      transition: var(--transition);
    }

    .terms-group a:hover {
      text-decoration: underline;
    }

    .social-auth {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid rgba(0, 0, 0, 0.1);
    }

    .google-btn {
      width: 100%;
      padding: 12px;
      background: #FFFFFF;
      color: #1A1A1A;
      border: 1px solid #DADCE0;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 15px;
      cursor: pointer;
      font-weight: 500;
      transition: var(--transition);
    }

    .google-btn:hover {
      background: #F8F9FA;
    }

    .apple-btn {
      width: 100%;
      padding: 12px;
      background: #000000;
      color: #FFFFFF;
      border: none;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      font-weight: 500;
      transition: var(--transition);
    }

    .apple-btn:hover {
      background: #2C2C2C;
      transform: translateY(-1px);
    }

    .auth-links {
      margin-top: 20px;
      font-size: 0.9rem;
    }

    .auth-links a:hover {
      text-decoration: underline;
    }

    .auth-toggles {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
    }
  </style>
</head>

<body>

  <div class="auth-toggles">
    <button class="theme-toggle" title="Toggle Theme"><i class="ph ph-moon"></i></button>
    <button class="rtl-toggle" title="Toggle RTL"><i class="ph ph-arrows-left-right"></i></button>
  </div>

  <div class="auth-card">
    <a href="index.html" class="auth-logo">Bloom</a>
    <h2 style="margin-bottom: 20px; font-size: 1.5rem;">Create Account</h2>

    <form id="registerForm">
      <div class="form-group">
        <input type="text" placeholder="Full Name" required>
      </div>
      <div class="form-group">
        <input type="email" placeholder="Email Address" required>
      </div>
      <div class="form-group">
        <div class="password-field">
          <input type="password" placeholder="Password" required>
          <button type="button" class="password-toggle" aria-label="Toggle password visibility">
            <i class="ph ph-eye"></i>
          </button>
        </div>
      </div>
      <div class="form-group">
        <div class="password-field">
          <input type="password" placeholder="Confirm Password" required>
          <button type="button" class="password-toggle" aria-label="Toggle password visibility">
            <i class="ph ph-eye"></i>
          </button>
        </div>
      </div>
      <div class="terms-group">
        <input type="checkbox" id="terms" required>
        <label for="terms">I accept the <a href="#">Terms & Conditions</a> and <a href="#">Privacy Policy</a></label>
      </div>
      <button type="submit" class="auth-btn">Register</button>
    </form>

    <div class="social-auth">
      <button class="google-btn">
        <i class="ph ph-google-logo" style="color: #4285F4; font-size: 1.2rem;"></i>
        Continue with Google
      </button>
      <button class="apple-btn">
        <i class="ph ph-apple-logo" style="font-size: 1.2rem;"></i>
        Continue with Apple
      </button>
    </div>

    <div class="auth-links">
      Already have an account? <a href="login.html">Login</a>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
</body>

</html>
