<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found | Bloom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Jost:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    body { height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; }
    .error-container { max-width: 600px; padding: 40px; }
    .error-icon { font-size: 8rem; color: var(--color-primary); margin-bottom: 20px; opacity: 0.5; }

<body>

    <div class="error-icon"><i class="ph-leaf"></i></div>

    <p style="margin: 20px 0 40px;">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
    <div style="display: flex; gap: 20px; justify-content: center;">
      <a href="index.html" class="btn btn-primary">Back to Home</a>
      <a href="shop.html" class="btn btn-outline">Visit the Shop</a>
